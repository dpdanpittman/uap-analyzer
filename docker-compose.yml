services:
  uap-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: uap-analyzer:latest
    container_name: uap-analyzer
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.6.56:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwq:32b}
      # Default flipped in v0.4.3: qwen2.5vl:7b is the vision default for both
      # describe and HUD paths. llama3.2-vision:11b was producing false-confident
      # negatives ("clear thermal image of the ocean" for frames containing a
      # reticle + aircraft) and on one frame entered an infinite generation loop.
      # See reports/dod_111720765_target_lock.md for the trigger case.
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OLLAMA_HUD_MODEL: ${OLLAMA_HUD_MODEL:-qwen2.5vl:7b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      # faster-whisper (audio transcription). base.en is the default; bump
      # to small.en/medium.en for jargon-heavy clips. int8 on CPU is fine.
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # Container-internal paths — fixed. The host-side path is controlled by
      # UAP_HOST_DATA_DIR (used only as the bind-mount source below).
      UAP_DATA_DIR: /srv/uap-data
      UAP_CACHE_DIR: /srv/uap-data/.cache
      UAP_HOST: ${UAP_HOST:-0.0.0.0}
      UAP_PORT: ${UAP_PORT:-3260}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Default points at the actual corpus location on zaphod so a missing
      # .env file does NOT silently fall back to an empty /srv/uap-data and
      # break the corpus mount (regression learned 2026-05-22).
      - ${UAP_HOST_DATA_DIR:-/home/zaphod-beeblebox/uap-data}:/srv/uap-data
